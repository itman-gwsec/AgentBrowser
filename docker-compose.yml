# AgentBrowser 전용 컨테이너 오케스트레이션 (M6)
#
# - 도커 컨테이너에서 에이전트용 웹 브라우저(실제 Chrome, headed) 실행
# - 호스트 실제 지문(GPU/WebGL renderer, CPU 스레드수, 해상도)을 env 로 주입
# - 포트 미개방: CDP 는 --remote-debugging-pipe(FD 3/4) 사용 → 방화벽 프롬프트 없음
# - 컨테이너별 미세 지문 drift: CHROME_CONTAINER_INDEX 미설정 시 entrypoint 가
#   hostname 기반 나머지 연산으로 결정적 인덱스 파생 (스케일 시 지문 분산)
#
# 실행:  docker compose up
# 스케일(지문 분산):  docker compose up --scale agent-browser=4

services:
  agent-browser:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentbrowser:m6
    # 포트 미개방 (pipe 모드). 외부 노출 불필요.
    # env 로 호스트 실제 지문 주입 (값은 호스트 측정값으로 교체 권장).
    environment:
      # ── GPU / WebGL 지문 ──
      CHROME_GPU_VENDOR: "Google Inc. (Apple)"
      CHROME_GPU_RENDERER: "ANGLE (Apple, Apple M2 Pro, OpenGL 4.1)"
      # ── 하드웨어 동시성(CPU 스레드수) ──
      CHROME_HARDWARE_CONCURRENCY: "10"
      # ── 디스플레이 해상도 / DPI ──
      CHROME_SCREEN_W: "1728"
      CHROME_SCREEN_H: "1117"
      CHROME_DEVICE_SCALE_FACTOR: "2.0"
      # ── WebGL 백엔드 (호스트 GPU 없으면 swiftshader 소프트웨어 렌더링) ──
      CHROME_GL_BACKEND: "angle"
      CHROME_ANGLE_BACKEND: "swiftshader"
      # ── 컨테이너별 지문 drift 인덱스 ──
      # 미설정 시 entrypoint 가 hostname 기반 나머지 연산으로 결정적 파생.
      # 명시적으로 고정하려면 아래 해제:
      # CHROME_CONTAINER_INDEX: "0"
    # 전용 프로파일 + 메모리(FTS5용, RAG 미사용이나 준비) 볼륨.
    volumes:
      - ./profiles:/app/profiles
      - ./memory:/app/memory
    # headed 원칙: 컨테이너 내 display 는 entrypoint 가 xvfb 로 제공.
    # (실제 GPU 패스스루가 있으면 DISPLAY 를 호스트 DISPLAY 로 매핑 가능)
    restart: "no"
    # 기본 CMD 는 지문 주입 probe 출력. 실제 agent 구동 시 아래로 교체:
    # command: ["python", "-m", "core.launcher", "--profile", "default"]
